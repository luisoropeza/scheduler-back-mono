spring:
  application:
    name: scheduler
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: postgres
    password: mysecretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        multiTenancy: SCHEMA
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key:
        chat:
          model: gemini-3.5-flash-lite

twilio:
  account-sid: "TU_ACCOUNT_SID"
  auth-token: "TU_AUTH_TOKEN"
  whatsapp-number: "whatsapp:+14155238886"

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080

cors:
  allowed-origins: *

jwt:
  secret: change-me-in-production-minimum-32-chars!

security:
  public-paths: /api/auth/login, /api/clinics, /swagger-ui/**, /v3/api-docs/**

app:
  mail:
    from: no-reply@scheduler.local
    from-name: Scheduler
